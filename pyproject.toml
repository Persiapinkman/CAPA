[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capa-planner"
version = "0.1.0"
description = "Planner-centric visual AI capability routing and evaluation"
requires-python = ">=3.10,<3.11"
dependencies = [
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "openai==2.45.0",
  "pillow==12.3.0",
  "pysocks==1.7.1",
  "requests==2.34.2",
  "socksio==1.0.0",
]

[project.optional-dependencies]
demo = [
  "fastapi==0.136.3",
  "uvicorn==0.49.0",
]
rag-smoke = [
  "fastapi==0.136.3",
  "pydantic-settings==2.13.1",
  "uvicorn==0.49.0",
]
train-cu124 = [
  "accelerate==1.14.0",
  "datasets==5.0.0",
  "peft==0.19.1",
  "torch==2.6.0",
  "transformers==4.57.6",
  "trl==1.8.0",
  "wandb==0.28.0",
]
observability = [
  "wandb==0.28.0",
  "wandb-workspaces==0.4.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
