[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capa-planner"
version = "0.1.0"
description = "Planner-centric visual AI capability routing and evaluation"
requires-python = ">=3.10,<3.11"
dependencies = [
  "httpx==0.28.1",
  "openai==2.45.0",
  "pillow==12.3.0",
  "requests==2.34.2",
]

[project.optional-dependencies]
demo = [
  "fastapi==0.136.3",
  "uvicorn==0.49.0",
]
train-cu124 = [
  "accelerate==1.14.0",
  "datasets==5.0.0",
  "peft==0.19.1",
  "torch==2.6.0",
  "transformers==4.57.6",
  "trl==1.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
