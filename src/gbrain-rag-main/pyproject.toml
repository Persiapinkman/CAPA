[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gbrain-rag"
version = "0.1.0"
description = "A gbrain-inspired hybrid RAG service for the swift-rag corpus."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "numpy>=1.26",
  "openai>=1.40",
  "requests>=2.31",
  "sentence-transformers>=5.0",
  "pypdf>=4.0",
  "pdfplumber>=0.11",
  "PyMuPDF>=1.24",
  "pandas>=2.0",
  "openpyxl>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
